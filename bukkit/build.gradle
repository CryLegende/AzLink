repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
    maven { url = 'https://repo.nickuc.com/maven-releases/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    // SkyHand's SHNetwork (network mode), installed locally with 'mvn install'
    mavenLocal {
        content {
            includeGroup 'org.Cry_Legende'
        }
    }
}

dependencies {
    implementation project(':azlink-common')
    compileOnly 'dev.folia:folia-api:1.19.4-R0.1-SNAPSHOT'
    compileOnly 'io.netty:netty-all:4.1.25.Final'
    compileOnly 'fr.xephi:authme:5.6.0-beta2'
    compileOnly 'com.nickuc.login:nlogin-api:10.3'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // Only used by the network package, compiled with Java 25 as SHNetwork
    compileOnly('org.Cry_Legende:SHNetwork:1.0') {
        transitive = false
    }
}

java {
    // Folia is compiled with Java 17
    disableAutoTargetJvm()
}

processResources {
    filesMatching('*.yml') {
        expand 'pluginVersion': version
    }
}
